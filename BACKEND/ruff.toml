# Lint gate for CI. Starts with the checks that catch crashes: syntax errors
# and undefined names (BarberPaymentsView once shipped without importing
# timezone and returned 500 on every request). Widen `select` as the old code
# gets cleaned up.
extend-exclude = ["venv", "node_modules", "staticfiles", "core/migrations"]

[lint]
select = ["E9", "F63", "F7", "F82"]
